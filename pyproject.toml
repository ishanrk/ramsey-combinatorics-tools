[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramsey-tools"
version = "0.0.0"
description = "a shared layout for ramsey theory tools"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]
sat = ["python-sat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
